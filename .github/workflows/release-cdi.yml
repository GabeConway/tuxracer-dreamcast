# Builds the disc image, and only for a tag.
#
# Nothing here runs on an ordinary push or pull request: a CDI build means
# building the whole sh-elf toolchain image and fetching the 12 MB data package,
# which is minutes of runner time that a source-only change does not need. Tag
# `v*` (or run the workflow by hand) and this produces `TuxRacer.cdi` as a
# workflow artifact.
#
# IT DOES NOT ATTACH ANYTHING TO A RELEASE, and that is deliberate.
#
# A runner cannot boot a Dreamcast image: Flycast has no headless mode
# (SDL_VIDEODRIVER=dummy and =offscreen both abort), so nothing here can tell
# a working build from a black screen. That would be a tolerable risk in most
# projects. It is not tolerable in this one, because the port has a latent
# memory bug whose symptom is decided purely by heap layout (kb/design-perf.md),
# and the margin is tiny: CI's toolchain image and the maintainer's differ by
# FOUR BYTES of .text, and that was enough for the CI build to hang before its
# first frame while the local build of the same commit raced fine. v0.1.0 and
# v0.1.1 both shipped that way.
#
# So release assets are cut locally, after harness/dc/release-gate.sh has
# actually booted them (see README, "Cutting a release"). This workflow exists
# to prove the tree still builds from nothing on a clean machine, which is
# worth having on its own.
#
# ARM64 runners on purpose. Every docker invocation in this repo passes
# `--platform linux/arm64` -- that is deliberate on the maintainer's Apple
# Silicon host, where an accidental amd64 pull drops the build into qemu. On
# `ubuntu-24.04-arm` that platform is native, so CI and the workstation build
# the same image the same way. Do not "fix" this to ubuntu-latest.
#
# The release asset contains upstream's GPL-2.0 game data, fetched and
# sha256-verified at build time. That is redistribution, which the licence
# allows; the data is still not committed to this repository.

name: release-cdi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (blank = build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  cdi:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain image is the expensive part -- ~24 min from
      # debian:bookworm on this runner. It only changes when its recipe does,
      # so the cache is keyed on the recipe.
      #
      # restore/save rather than the combined action on purpose: the combined
      # form only saves in a post step, which is SKIPPED when a later step
      # fails, so a build that got the image right and then tripped over
      # something trivial threw the 24 minutes away. This banks it immediately.
      - name: Restore toolchain image
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tuxracer-dc-sdk
          key: sdk-${{ runner.arch }}-${{ hashFiles('dc/Dockerfile', 'dc/Dockerfile.overlay') }}

      - name: Load cached toolchain image
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/tuxracer-dc-sdk/sdk.tar

      - name: Build toolchain image
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # Standalone: the overlay base (opencrossing-dc:sdk) is a local image
          # on the maintainer's machine and does not exist on a runner.
          TR_DC_FORCE_STANDALONE=1 bash dc/build-dc-image.sh
          mkdir -p ~/.cache/tuxracer-dc-sdk
          docker save tuxracer-dc:sdk -o ~/.cache/tuxracer-dc-sdk/sdk.tar

      - name: Save toolchain image
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true      # a cache hiccup must not fail a release
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/tuxracer-dc-sdk
          key: sdk-${{ runner.arch }}-${{ hashFiles('dc/Dockerfile', 'dc/Dockerfile.overlay') }}

      # Keyed on the checksums in fetch-data.sh, so a changed pin misses.
      - name: Cache upstream tarballs
        uses: actions/cache@v4
        with:
          path: upstream/tarballs
          key: data-${{ hashFiles('tools/fetch-data.sh') }}

      - name: Fetch and verify game data
        run: bash tools/fetch-data.sh

      # The disc gets ./data-dc, NOT ./data. Staging rewrites the seven sound
      # effects to mono 22050 Hz and trims the three looping terrain sounds
      # under the AICA's 65534-sample ceiling -- without it the whole effect
      # set costs 1.6 MB of a 2 MB sound-RAM pool and three of them are cut at
      # an arbitrary point. v0.1.1 shipped the unstaged data by mistake.
      # ffmpeg is preinstalled on GitHub's ubuntu runners.
      - name: Stage disc data
        run: |
          ffmpeg -version | head -1
          bash tools/stage-data.sh

      - name: Compile check
        run: DC_TARGET=objs bash dc/build-dc.sh

      - name: Build CDI
        run: TR_DATA=./data-dc bash dc/build-dc.sh

      # Written to the workspace root, NOT into dc/build: the build runs in a
      # container as root, so dc/build is root-owned and the runner user
      # cannot create a file there.
      - name: Checksums
        run: |
          sha256sum dc/build/TuxRacer.cdi dc/build/tuxracer.elf \
            | sed 's|dc/build/||' > SHA256SUMS
          cat SHA256SUMS
          ls -l dc/build/TuxRacer.cdi dc/build/tuxracer.elf

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuxRacer-cdi
          path: |
            dc/build/TuxRacer.cdi
            dc/build/tuxracer.elf
            SHA256SUMS
          if-no-files-found: error
